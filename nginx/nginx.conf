worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        location / {
            return 200 '{"service": "devops-sandbox", "status": "running"}';
            add_header Content-Type application/json;
        }

        # Per-environment reverse proxy configs are auto-generated here
        include /etc/nginx/conf.d/*.conf;
    }
}
